services:
  cyberoffice:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-25}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.65}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-700}
      - OFFICE_DECISION_MODE=${OFFICE_DECISION_MODE:-llm_parallel}
      - OFFICE_LLM_DECISION_ENABLED=${OFFICE_LLM_DECISION_ENABLED:-true}
      - OFFICE_LLM_DECISION_COOLDOWN_TICKS=${OFFICE_LLM_DECISION_COOLDOWN_TICKS:-0}
      - OFFICE_LLM_PARALLEL_CONCURRENCY=${OFFICE_LLM_PARALLEL_CONCURRENCY:-8}
      - OFFICE_LLM_DECISION_TIMEOUT_SECONDS=${OFFICE_LLM_DECISION_TIMEOUT_SECONDS:-25}
      - OFFICE_LLM_DECISION_TEMPERATURE=${OFFICE_LLM_DECISION_TEMPERATURE:-0.72}
      - OFFICE_LLM_DECISION_MAX_TOKENS=${OFFICE_LLM_DECISION_MAX_TOKENS:-600}
      - DIALOGUE_INFLUENCE_TTL_TICKS=${DIALOGUE_INFLUENCE_TTL_TICKS:-8}
      - DIALOGUE_INTERRUPT_CURRENT_EPISODE=${DIALOGUE_INTERRUPT_CURRENT_EPISODE:-true}
      - MEMORY_COMPACT_THRESHOLD=${MEMORY_COMPACT_THRESHOLD:-72}
      - MEMORY_COMPACT_KEEP_RECENT=${MEMORY_COMPACT_KEEP_RECENT:-24}
      - MEMORY_COMPACT_BATCH_SIZE=${MEMORY_COMPACT_BATCH_SIZE:-36}
      - MEMORY_SUMMARY_USE_LLM=${MEMORY_SUMMARY_USE_LLM:-true}
      - MEMORY_SUMMARY_MAX_TOKENS=${MEMORY_SUMMARY_MAX_TOKENS:-420}
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    volumes:
      - cyberoffice_data:/app/data
      - cyberoffice_logs:/app/logs
volumes:
  cyberoffice_data:
  cyberoffice_logs:
